# Main project configuration

# Data universe for training.
# This list intentionally uses 100 large/liquid US-listed stocks across sectors
# so the model learns from a broader market sample than a small tech-only basket.
# Broad sector coverage includes technology, communication services,
# consumer discretionary, consumer staples, financials, health care,
# industrials, energy, utilities, materials, and real estate.
