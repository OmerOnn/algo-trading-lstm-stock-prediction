# 2015, so ETF-based sector returns would be missing for a third of the sample
# and would delete every pre-2018 row for the communication-services names. A
# composite of the actual universe exists from the first date and is the more
# precise benchmark for these particular stocks.
#
# Sectors with fewer than minimum_sector_members names fall back to the
