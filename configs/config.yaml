# Features retired by the permutation-importance stage because they were
# unstable, consistently zero, or harmful across out-of-fold folds. Applied to
# the feature list, never to the cached panel, so no rebuild is needed.
feature_blocklist: []


# Alternative / macro market data.
# These are added to satisfy the project requirement of using financial data
# together with alternative / macro indicators.
macro_tickers:
  vix: "^VIX"
  treasury_10y: "^TNX"
  usd_index: "DX-Y.NYB"


# Long history improves regime coverage and supplies indicator warm-up data.
start_date: "2005-01-01"
end_date: null   # null means download until today

random_seed: 42

# Dataset cache.
# When true, processed supervised datasets are saved under data/cache and reused
# by later training runs with the same horizon.
use_dataset_cache: true
force_rebuild_dataset_cache: false

# Present-day earnings snapshots are not a point-in-time historical database.
# Keep disabled unless a properly timestamped historical source is supplied.
use_earnings_features: false

# Supervised learning setup.
# A shorter window than the original 60 sessions: the features already summarise
# multi-horizon momentum, so extra sequence length mainly added capacity to
# memorise date-specific noise (validation error rose from epoch 1 at 60).
window_size: 30

# Trailing window used to z-score regime-sensitive features per ticker.
# Only past observations enter each z-score, so there is no look-ahead.
regime_normalization_window: 252

# Drop features that are identical for every ticker on a given date
# (benchmark_* and macro_*). With a market-excess target these carry no
# cross-sectional ranking information, but they let a sequence model identify
# which date a window came from and memorise that date's noise. Stock-specific
# market-relative features (excess_return_*, market_beta_60d,
# idiosyncratic_volatility_20d) are kept, so market context is still used.
exclude_market_wide_features: true

# Prediction horizons are measured in trading days, not calendar days.
# Approximation: 1 trading week = 5 sessions, 1 trading month = 21 sessions.
# The UI lets the user choose a horizon only after that horizon was trained.
prediction_horizons:
  - 21     # one dedicated model per horizon, per model family
default_prediction_horizon: 21

# Backward-compatible value. Used only if prediction_horizons is missing.
prediction_horizon: 21

# Legacy thresholds, kept only for backward compatibility in dataset helpers.
buy_threshold: 0.03
sell_threshold: -0.03

# --- Training target ---------------------------------------------------------
# The reported prediction is always the total future percentage return:
#   future_return = Close[t + h] / Close[t] - 1
# But the model is trained on the decomposition
#   future_return = benchmark_future_return + future_excess_return
# and learns only the excess (market-relative) leg. The market leg carries most
# of the variance of a pooled panel and is not forecastable from technicals, so
# including it in the target only injects noise. At inference the market leg is
# supplied by a drift estimated on the training window alone.
#
# mode:
#   "market_excess"     - train on (stock return - benchmark return), vol-scaled
#   "volatility_scaled" - train on the total return, vol-scaled
#   "raw_return"        - train on the total return, unscaled
regression_target:
  mode: "market_excess"
  volatility_column: "idiosyncratic_volatility_20d"
  fallback_volatility_column: "volatility_20d"
  daily_volatility_floor: 0.005
  target_clip: 4.0

# Hardware settings
# auto = use Apple Metal GPU when available, otherwise fall back safely
device: "auto"
num_workers: 0
pin_memory: true

# --- Model settings ----------------------------------------------------------
model_type: "lstm"       # "lstm" or "gru"
hidden_size: 64
num_layers: 1
dropout: 0.35
# Drops whole input features per step. On ~70 correlated indicators this is a
# much stronger regulariser than weight decay alone.
input_dropout: 0.25
batch_size: 256

# Batches made of whole date cross-sections, so the ranking term of the loss has
# a real cross-section to work with. "shuffled" restores plain row sampling.
lstm_batching: "date_grouped"
dates_per_batch: 3
max_rows_per_batch: 4096

# Variational (timestep-shared) dropout on the recurrent output. The fused
# LSTM kernels do not expose their internal gates, so a true recurrent-gate mask
# is not available without giving up the fused kernel.
recurrent_dropout: 0.0

# Optional auxiliary regression heads on other horizons. All heads are
# regression heads and the saved forecast is always the selected horizon.
auxiliary_horizons: []

learning_rate: 0.0002
epochs: 40
weight_decay: 0.0005
feature_scaler: "robust"          # less sensitive to return/volume outliers

# Number of independently seeded members averaged into the final forecast.
# Averaging de-correlated fits is the most reliable variance reduction available
# on a low signal-to-noise target, and the member spread feeds the uncertainty
# estimate. Set to 1 for a fast single-model run.
ensemble_size: 3

# Chronological split. Do not random-split time-series data.
train_ratio: 0.70
validation_ratio: 0.15   # test ratio is the remaining 0.15
purge_overlapping_labels: true

# Purged walk-forward validation, used by `--walk-forward`. Each fold refits
# from scratch on data strictly before its own test window.
walk_forward:
  folds: 3
  initial_train_ratio: 0.50
  validation_ratio: 0.15
  expanding: true

# --- Training control --------------------------------------------------------
# Checkpoint on the mean per-date cross-sectional information coefficient: the
# quantity a stock-selection model can actually learn. Pooled MAE or correlation
# reward a constant forecast, which is why earlier runs peaked at epoch 1.
# Checkpoint on a criterion that requires BOTH magnitude and ranking skill:
#   validation_selection_score = cross_sectional_ic
#                              + selection_score_magnitude_weight * mse_skill
# MSE alone rewards a constant forecast (which is why earlier runs peaked at
# epoch 1); IC alone rewards a model that ranks well while reporting wrong
# percentages. Requiring both rules out each failure mode.
early_stopping_metric: "validation_selection_score"
selection_score_magnitude_weight: 0.25
early_stopping_patience: 6
early_stopping_min_delta: 0.0002
max_grad_norm: 1.0
# Composite objective. MSE genuinely contributes to the gradient -- it is not
# merely reported afterwards -- because the product promises an expected
# percentage return, so magnitude has to be optimised, not only ordering.
#   mse    : makes the magnitude meaningful
#   huber  : caps the gradient of extreme return events on a fat-tailed panel
#   ic     : the only term that rewards getting the cross-sectional ordering right
# Selected by purged walk-forward comparison of pure_mse, pure_huber, mse_huber
# and mse_huber_ic at an identical epoch budget. This configuration won on all
# three folds (mean IC +0.0371, std 0.0214) and was also the most stable; adding
# the date-IC term to mse_huber was the largest single improvement in the table.
# It is ~5x slower per epoch because the grouped correlation is computed on every
# batch. See reports/experiments/experiment_lstm_loss_h21.md.
regression_loss:
  mse_weight: 0.40
  huber_weight: 0.40
  cross_sectional_ic_weight: 0.20
  huber_beta: 0.5
  minimum_names_per_date: 5
lr_scheduler_patience: 2
lr_scheduler_factor: 0.5
minimum_learning_rate: 0.000001

# --- Uncertainty estimation --------------------------------------------------
# LSTM  : Monte Carlo dropout across the seed ensemble.
# XGBoost: moving-block bootstrap ensemble.
# Both are then turned into intervals by normalised split-conformal calibration
# fitted on validation data only.
uncertainty:
  confidence_level: 0.80          # nominal coverage of the reported range
  mc_dropout_passes: 10           # stochastic passes per LSTM ensemble member
  bootstrap_models: 15            # XGBoost bootstrap members
  bootstrap_block_size: 21        # contiguous sessions per bootstrap block
  minimum_sigma: 0.005            # floor so no forecast gets a zero-width band

# --- Decision layer ----------------------------------------------------------
# BUY / HOLD / SELL derived from the regression output and its uncertainty.
#   risk_adjusted : act when (predicted_return - cost hurdle) / sigma clears
#                   min_z_score, so a forecast on a volatile name must be larger
#                   to earn the same signal. Parameters are tuned on validation.
#   point         : classic fixed return threshold, no uncertainty input.
decision:
  rule: "risk_adjusted"
  position_sizing: "binary"        # "binary" or "confidence"
  min_direction_probability: 0.0

# --- Stage 1: the market-return model ----------------------------------------
# expected_stock_return = beta * expected_market_return + expected_stock_residual
#
# The market leg comes from a ridge regression on date-level market-state
# features, shrunk towards the training-window historical drift. The shrinkage
# weight is chosen from agreement across purged folds, so market-return skill has
# to repeat before it is allowed to move a stock forecast. On this panel the folds
# disagreed and the selected weight was 0.000, which reduces the composition to
# the constant drift exactly -- a month-ahead index forecast did not generalise.
market_model:
  ridge_alpha: 10.0
  maximum_shrinkage: 0.60

# --- Portfolio construction (fully invested, for a fair comparison) ----------
# The signal backtest holds cash whenever no name clears the hurdle, which left
# it ~17-31% invested; comparing that to 100%-invested buy-and-hold is not a fair
# test. The top-k portfolio is always fully invested, so the difference against
# the equal-weight universe is attributable to selection rather than exposure.
portfolio:
  top_k: 20
  top_quantile: 0.20

# --- Acceptance gates --------------------------------------------------------
# Pre-registered pass/fail criteria. Reported, never optimised against.
acceptance_thresholds:
  walk_forward_mean_ic: 0.03
  ic_t_statistic: 2.0
  minimum_coverage_error: 0.05
  maximum_normalized_interval_width: 3.0
  regime_collapse_ic: 0.0

# Repeats per feature for out-of-fold permutation importance.
permutation_repeats: 2

# --- Backtesting -------------------------------------------------------------
initial_cash: 10000
transaction_cost_pct: 0.001    # 0.10% per trade
slippage_pct: 0.0005           # 0.05% simulated slippage
signal_threshold_multiplier: 1.0
min_signal_edge: 0.0
allow_short: false             # false = long / cash only, true = long / short / cash
threshold_min_active_trades: 20
evaluation_regime_blocks: 4

# Output paths.
# Horizon-specific files are created automatically, for example:
# models/stock_advanced_model_h21.pt
# models/feature_scaler_h21.pkl
# models/model_metadata_h21.json
model_output_path: "models/stock_advanced_model.pt"
scaler_output_path: "models/feature_scaler.pkl"
metadata_output_path: "models/model_metadata.json"
metrics_output_path: "reports/metrics.json"
backtest_output_path: "reports/backtest_results.csv"
plots_output_dir: "reports/plots"

# XGBoost settings - second model family for a like-for-like comparison.
#
# There is deliberately no early-stopping setting. Boosters are fitted once to
# n_estimators rounds and then *scored at a ladder of iteration counts* on purged
# walk-forward folds, using per-date cross-sectional IC plus magnitude skill; one
# fit yields the whole curve via iteration_range. XGBoost's own early stopping
# could only optimise a pooled metric, and the quantity that matters here is an
# average of per-date correlations, which its callback interface cannot express.
#
# n_estimators is therefore an upper bound on the search, not the number of trees
# that ship. No minimum-round floor is applied: the previous version reported
# best_iteration = 0 and then silently used 50 trees, so the recorded number
# described nothing that had happened.
#
# max_depth 5 is the configured baseline; --grid-search compares it against
# depth 3 / 7 and the other documented one-at-a-time variants on folds. On this
# panel the grid selected depth 3.
xgboost:
  device: auto
  objective: "reg:squarederror"   # "reg:pseudohubererror" is compared in the grid
  n_estimators: 800               # upper bound for the round ladder, not a final count
  max_depth: 5
  learning_rate: 0.02
  subsample: 0.8
  colsample_bytree: 0.6
  min_child_weight: 20.0
  reg_alpha: 0.10
  reg_lambda: 3.0
  random_state: 42
